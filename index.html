<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHM Studio - AI Video Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center font-black text-slate-950 text-xl">AHM</div>
            <div>
                <h1 class="font-bold text-lg leading-none">AHM Studio</h1>
                <span class="text-xs text-amber-400">Open-Source GPU Powered</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-4xl mx-auto p-4 w-full space-y-6">

        <!-- GPU Connection Config -->
        <div class="bg-slate-900 border border-amber-500/30 rounded-2xl p-4">
            <label class="block text-xs text-amber-400 font-semibold mb-1">1. Paste RunPod GPU URL (Port 8188)</label>
            <input type="text" id="gpu-url" placeholder="https://xxxx-8188.proxy.runpod.net" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:border-amber-500 outline-none">
        </div>

        <!-- Script Input -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <label class="block text-xs text-slate-400 font-semibold">2. Story Script</label>
            <textarea id="script-text" rows="5" placeholder="Write your full character script here..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:border-amber-500 outline-none resize-none"></textarea>
            
            <button onclick="sendToGPU()" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl flex items-center justify-center gap-2 text-sm shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-bolt"></i> Generate Video via GPU
            </button>
        </div>

        <!-- Render Output -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center">
            <h3 class="font-bold text-sm text-slate-200 mb-3 flex items-center justify-center gap-2">
                <i class="fa-solid fa-film text-amber-400"></i> Rendered Output
            </h3>
            
            <div id="status-box" class="text-xs text-slate-400 py-8 border border-dashed border-slate-800 rounded-xl">
                Ready to generate. Enter your GPU URL and script above.
            </div>

            <video id="output-video" controls class="hidden w-full max-h-[450px] rounded-xl mt-3 object-cover"></video>
            
            <a id="download-link" download="AHM_Studio_Video.mp4" class="hidden mt-4 inline-block w-full py-3 bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl text-center">
                Download Finished Video
            </a>
        </div>

    </main>

    <script>
        async function sendToGPU() {
            const gpuUrl = document.getElementById('gpu-url').value.trim();
            const script = document.getElementById('script-text').value.trim();
            const statusBox = document.getElementById('status-box');

            if (!gpuUrl || !script) {
                alert("Please provide both your RunPod GPU URL and script!");
                return;
            }

            statusBox.innerHTML = '<span class="text-amber-400"><i class="fa-solid fa-spinner animate-spin"></i> Connecting to RunPod GPU & rendering video frames...</span>';

            try {
                // Formatting payload for Wan 2.1 / ComfyUI API endpoint
                const response = await fetch(`${gpuUrl}/prompt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: {
                            "1": { "class_type": "WanTextToVideo", "inputs": { "prompt": script } }
                        }
                    })
                });

                if (response.ok) {
                    statusBox.innerHTML = '<span class="text-emerald-400"><i class="fa-solid fa-check"></i> Generation finished! Video loaded below.</span>';
                    const videoPlayer = document.getElementById('output-video');
                    const downloadBtn = document.getElementById('download-link');
                    
                    // Route to generated stream
                    videoPlayer.src = `${gpuUrl}/view?filename=output.mp4`;
                    videoPlayer.classList.remove('hidden');
                    downloadBtn.href = `${gpuUrl}/view?filename=output.mp4`;
                    downloadBtn.classList.remove('hidden');
                } else {
                    throw new Error("GPU Server connection failed.");
                }
            } catch (err) {
                statusBox.innerHTML = `<span class="text-red-400"><i class="fa-solid fa-triangle-exclamation"></i> Error: ${err.message}. Make sure your RunPod GPU is active.</span>`;
            }
        }
    </script>
</body>
</html>
