<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Story Maker</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      background: #121212; 
      color: white; 
      padding: 15px; 
      text-align: center; 
    }
    textarea { 
      width: 90%; 
      height: 80px; 
      margin-bottom: 10px; 
      border-radius: 8px; 
      padding: 10px; 
      font-size: 16px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
    }
    button { 
      background: #ffeb3b; 
      color: black; 
      border: none; 
      padding: 15px 20px; 
      font-size: 16px; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      margin: 10px 0; 
      width: 95%;
    }
    canvas { 
      background: #000; 
      margin-top: 15px; 
      border-radius: 12px; 
      width: 100%; 
      max-width: 360px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
    }
    #video-container { 
      display: none; 
      flex-direction: column; 
      align-items: center; 
    }
    #status { font-weight: bold; color: #4caf50; }
    #error { font-weight: bold; color: #ff5252; }
  </style>
</head>
<body>

  <h2>AI Story Generator</h2>
  <textarea id="scriptInput">My wife betrayed me and abandoned me. Please make her the way she used to be.</textarea>
  <br>
  
  <button id="startBtn" onclick="generateVideo()">1. Generate AI Video</button>
  <p id="status"></p>
  <p id="error"></p>

  <div id="video-container">
    <canvas id="canvas" width="360" height="640"></canvas>
    <audio id="audio" crossorigin="anonymous" playsinline></audio>
    <button id="downloadBtn" style="display:none;">2. Download Video</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audio');
    const statusText = document.getElementById('status');
    const errorText = document.getElementById('error');
    const downloadBtn = document.getElementById('downloadBtn');
    
    let mediaRecorder;
    let recordedChunks = [];
    let animationFrame;
    let scale = 1.0;

    async function generateVideo() {
      statusText.innerText = "Initializing audio engine...";
      errorText.innerText = "";
      document.getElementById('video-container').style.display = 'flex';
      downloadBtn.style.display = 'none';

      // Unlock mobile audio playback context on direct tap
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      const script = document.getElementById('scriptInput').value;
      statusText.innerText = "Generating AI Image... (Please wait)";

      // 1. Fetch Image via Pollinations
      const prompt = encodeURIComponent("3D Pixar style, realistic sad lemon head man wearing overalls in a wooden boat on a river, 9:16 vertical render");
      const imageUrl = `https://image.pollinations.ai/prompt/${prompt}?width=360&height=640&nologo=true`;

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = imageUrl;

      img.onerror = () => {
        errorText.innerText = "Failed to load AI image. Try tapping generate again.";
        statusText.innerText = "";
      };

      img.onload = () => {
        statusText.innerText = "Image loaded! Fetching voiceover...";
        
        // 2. Fetch Audio via StreamElements (CORS enabled)
        const encodedText = encodeURIComponent(script);
        audio.src = `https://api.streamelements.com/kappa/v2/speech?voice=Brian&text=${encodedText}`;

        audio.onerror = () => {
          errorText.innerText = "Failed to load audio stream.";
          statusText.innerText = "";
        };

        audio.oncanplaythrough = () => {
          statusText.innerText = "Recording video with motion effect...";
          startRecording(img, audioCtx);
        };
      };
    }

    function startRecording(img, audioCtx) {
      const canvasStream = canvas.captureStream(30); 
      
      const audioSource = audioCtx.createMediaElementSource(audio);
      const audioDestination = audioCtx.createMediaStreamDestination();
      audioSource.connect(audioDestination);
      audioSource.connect(audioCtx.destination); 

      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDestination.stream.getAudioTracks()
      ]);

      // WebM codec widely supported across mobile browsers
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') 
        ? 'video/webm;codecs=vp9' 
        : 'video/webm';

      mediaRecorder = new MediaRecorder(combinedStream, { mimeType });
      recordedChunks = [];
      
      mediaRecorder.ondataavailable = e => { 
        if (e.data.size > 0) recordedChunks.push(e.data); 
      };
      
      mediaRecorder.onstop = exportVideo;
      mediaRecorder.start();
      
      audio.play().catch(err => {
        errorText.innerText = "Tap screen to allow audio playback.";
      });

      scale = 1.0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const scaledWidth = canvas.width * scale;
        const scaledHeight = canvas.height * scale;
        const offsetX = (canvas.width - scaledWidth) / 2;
        const offsetY = (canvas.height - scaledHeight) / 2;

        ctx.drawImage(img, offsetX, offsetY, scaledWidth, scaledHeight);
        
        scale += 0.0004;
        animationFrame = requestAnimationFrame(draw);
      }
      draw();

      audio.onended = () => {
        mediaRecorder.stop();
        cancelAnimationFrame(animationFrame);
        statusText.innerText = "Video Ready!";
        downloadBtn.style.display = 'block';
      };
    }

    function exportVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      
      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'ai_story_video.webm';
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(url);
      };
    }
  </script>
</body>
</html>
